<!doctype html>
<html lang="en" class="sl-theme-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Colony</title>
<link rel="stylesheet" href="/vendor/@shoelace-style/shoelace/dist/themes/dark.css">
<link rel="stylesheet" href="/colony.css">
</head>
<body>
<header id="hud">
  <strong>Agent Colony</strong>
  <nav id="planets"></nav>
  <span id="counts"></span>
  <span id="tools">
    <!-- Die Texte hier sind Englisch, die Vorgabesprache. Beim Laden setzt
         public/colony/i18n.mjs sie auf die Sprache aus der Config um; die
         Schluessel stehen in data-i18n (Text), data-i18n-title (title) und
         data-i18n-label (aria-label). Der title von "ordnen" fehlt bewusst:
         hud.mjs setzt ihn je Zustand, das waere eine zweite Quelle. -->
    <button id="reorder" data-i18n="hud.reorder">arrange</button>
    <button id="mode3d" aria-pressed="false" data-i18n-title="hud.mode3dTitle" title="Colony as a 3D scene: drag with the left button to rotate, with the right to pan, wheel zooms">3D</button>
    <button id="modekit" aria-pressed="false" hidden data-i18n-title="hud.kitTitle" title="Models instead of primitives: KayKit terrain, crate stacks, figures. 3D only.">Kit</button>
  </span>
  <div id="clock">
    <time id="now"></time>
    <span id="stamp"></span>
  </div>
</header>

<canvas id="colony"></canvas>
<canvas id="colony3d" hidden></canvas>
<div id="overlay3d" hidden></div>

<aside id="panel" hidden>
  <button id="close" aria-label="Close" data-i18n-label="panel.close">&times;</button>
  <div id="panel-body"></div>
</aside>

<footer id="legend">
  <div class="grp">
    <b data-i18n="legend.projects">Projects</b>
    <span class="sub" data-i18n="legend.fill">Fill:</span>
    <span><i class="sw active"></i><span data-i18n="legend.state.active">active &le;7d</span></span>
    <span><i class="sw quiet"></i><span data-i18n="legend.state.quiet">quiet &le;30d</span></span>
    <span><i class="sw stale"></i><span data-i18n="legend.state.stale">stale &gt;30d</span></span>
    <span class="sub" data-i18n="legend.ring">Border:</span>
    <span><i class="ring dirty"></i><span data-i18n="legend.git.dirty">dirty</span></span>
    <span><i class="ring unpushed"></i><span data-i18n="legend.git.unpushed">unpushed</span></span>
    <span><i class="ring clean"></i><span data-i18n="legend.git.clean">clean</span></span>
    <span><i class="ring norepo"></i><span data-i18n="legend.git.norepo">no repo</span></span>
    <span><i class="ring missing"></i><span data-i18n="legend.git.missing">missing</span></span>
  </div>
  <div class="grp">
    <b data-i18n="legend.agents">Agents</b>
    <span><i class="dot working"></i><span data-i18n="legend.agent.working">working</span></span>
    <span><i class="dot prompt"></i><span data-i18n="legend.agent.prompt">asking (tool call open)</span></span>
    <span><i class="dot waiting"></i><span data-i18n="legend.agent.waiting">waiting for me</span></span>
    <span><i class="dot idle"></i><span data-i18n="legend.agent.idle">idle</span></span>
    <span><i class="dot kid"></i><span data-i18n="legend.agent.kid">Subagent</span></span>
  </div>
  <div class="grp credits">
    <span title="Licences and sources: public/assets/kit/LICENSES.md" data-i18n-title="legend.creditsTitle" data-i18n="legend.credits">Models: KayKit (CC0) · Kenney Nature Kit (CC0) · Little Astronaut: jellevermandere (CC-BY) · Flying Robot: mshayan02 (CC-BY)</span>
  </div>
</footer>

<!-- three.js liegt in node_modules und wird vom Server unter /vendor/three/
     ausgeliefert. Die Importmap macht den blanken Namen "three" aufloesbar,
     wie ihn die Addons (OrbitControls, CSS2DRenderer) importieren - ohne
     Bundler geht das sonst nicht. Importiert wird three nur vom 3D-Renderer
     (public/colony/r3d/), und der wird erst geladen, wenn man ihn einschaltet. -->
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/build/three.module.js",
    "three/addons/": "/vendor/three/examples/jsm/",

    "@shoelace-style/shoelace/dist/": "/vendor/@shoelace-style/shoelace/dist/",
    "@shoelace-style/localize": "/vendor/@shoelace-style/localize/dist/index.js",
    "composed-offset-position": "/vendor/composed-offset-position/dist/composed-offset-position.esm.js",

    "lit": "/vendor/lit/index.js",
    "lit/": "/vendor/lit/",
    "lit-html": "/vendor/lit-html/lit-html.js",
    "lit-html/": "/vendor/lit-html/",
    "lit-element/": "/vendor/lit-element/",
    "@lit/reactive-element": "/vendor/@lit/reactive-element/reactive-element.js",
    "@lit/reactive-element/": "/vendor/@lit/reactive-element/",

    "@floating-ui/dom": "/vendor/@floating-ui/dom/dist/floating-ui.dom.esm.js",
    "@floating-ui/core": "/vendor/@floating-ui/core/dist/floating-ui.core.esm.js",
    "@floating-ui/utils": "/vendor/@floating-ui/utils/dist/floating-ui.utils.esm.js",
    "@floating-ui/utils/dom": "/vendor/@floating-ui/utils/dist/floating-ui.utils.dom.esm.js"
  }
}
</script>

<script type="module" src="/colony.js"></script>
</body>
</html>
